name: MyArrList CI/CD

on:
  push:
    branches: [ main, main_remote ]
  pull_request:
    branches: [ main, main_remote ]

jobs:
  build-test:
    name: Build-Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run unit tests
        run: mvn test

  deploy:
    name: Pseudo Deploy
    needs: build-test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Upload build artifact (Pseudo Deploy)
        uses: actions/upload-artifact@v3
        with:
          name: myapp-jar          
          path: target/*.jar       
